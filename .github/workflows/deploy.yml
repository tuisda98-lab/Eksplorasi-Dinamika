name: Deploy GeoLearn

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-supabase-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy evaluation-api --project-ref vjqqcdniqrqhylxswxmw --no-verify-jwt

      - name: Verify Edge Function is reachable
        run: |
          status=$(curl -s -o /tmp/evaluation-api-response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"action":"login","username":"__health_check__","passwordHash":"invalid"}' \
            https://vjqqcdniqrqhylxswxmw.supabase.co/functions/v1/evaluation-api)
          if [ "$status" = "404" ]; then
            echo "Edge Function evaluation-api tidak ditemukan."
            cat /tmp/evaluation-api-response.json
            exit 1
          fi
          echo "Edge Function reachable (HTTP $status)."

  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp index.html imsmanifest.xml _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
